<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Issue Reporter — Intelligent Cloud Incident Operations</title>
    
    <!-- Google Fonts: Playfair Display (Serif) & Plus Jakarta Sans / Inter (Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS with custom configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ivory: '#F8F7F3',
              'ivory-dark': '#F0EFEA',
              'ivory-border': '#EAE7DF',
              'near-black': '#171717',
              'charcoal': '#242424',
              'muted-grey': '#858585',
              'soft-lavender': '#B7ACF5',
              'lavender-light': '#F4F1FD',
              'lavender-deep': '#9A8CE8',
              'electric-blue': '#7B9EFF',
              'blue-light': '#F0F4FF',
              'blue-deep': '#557FE6',
              'border-subtle': '#EAE8E0',
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'Georgia', 'serif'],
              sans: ['"Plus Jakarta Sans"', '"Inter"', 'system-ui', '-apple-system', 'sans-serif'],
            },
            boxShadow: {
              'card': '0 4px 20px -2px rgba(23, 23, 23, 0.04), 0 2px 6px -1px rgba(23, 23, 23, 0.02)',
              'card-hover': '0 14px 34px -4px rgba(23, 23, 23, 0.07), 0 4px 14px -2px rgba(183, 172, 245, 0.25)',
              'lavender-glow': '0 12px 35px -5px rgba(183, 172, 245, 0.35)',
              'lavender-ambient': '0 25px 60px -15px rgba(183, 172, 245, 0.28)',
              'floating': '0 20px 45px -10px rgba(23, 23, 23, 0.08), 0 0 1px 1px rgba(234, 231, 223, 0.6)',
              'glass': '0 8px 32px 0 rgba(183, 172, 245, 0.15)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg-ivory: #F8F7F3;
        --color-near-black: #171717;
      }
      body {
        background-color: #F8F7F3;
        color: #171717;
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Subtle noise or mesh aura background */
      .bg-radial-gradient {
        background: radial-gradient(circle at 50% 0%, rgba(183, 172, 245, 0.18) 0%, rgba(123, 158, 255, 0.08) 35%, rgba(248, 247, 243, 0) 70%);
      }

      /* Custom delicate scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F8F7F3;
      }
      ::-webkit-scrollbar-thumb {
        background: #E2DFD5;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #B7ACF5;
      }
    </style>
  </head>
  <body class="bg-ivory text-near-black min-h-screen selection:bg-soft-lavender/30">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
